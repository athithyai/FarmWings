<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FarmWings</title>
    <meta name="description" content="FarmWings - Drone Mapping & Plant Intelligence. Plant-level detection, identification and health from drone RGB + NDVI." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111513'/%3E%3Cpath d='M16 27c0-8 3-13 10-16-7 0-10 3-10 8 0-5-3-8-10-8 7 3 10 8 10 16z' fill='%238fd46b'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="appbar">
      <a class="brand" href="#/" aria-label="FarmWings home">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 27c0-8 3-13 10-16-7 0-10 3-10 8 0-5-3-8-10-8 7 3 10 8 10 16z" /></svg>
        <span class="brand-name">Farm<b>Wings</b></span>
      </a>
      <nav class="nav" aria-label="Screens">
        <a href="#/" data-route="overview">Overview</a>
        <a href="#/map" data-route="map">Map</a>
        <a href="#/plants" data-route="plants">Plants</a>
        <a href="#/insights" data-route="insights">Insights</a>
        <a href="#/method" data-route="method">Methodology</a>
        <a href="#/analyze" data-route="analyze" class="nav-cta">Analyze survey</a>
      </nav>
      <label class="survey-switch">
        <span class="lbl">Survey</span>
        <select id="survey-select" aria-label="Survey"></select>
      </label>
    </header>

    <main id="screen" tabindex="-1"></main>

    <section id="map-screen" class="map-screen" hidden>
      <aside class="map-side left" aria-label="Map layers">
        <div id="layer-panel"></div>
      </aside>
      <div class="map-wrap">
        <div id="map" role="application" aria-label="Survey map"></div>
        <div class="map-tools" role="toolbar" aria-label="Area selection">
          <button class="tool" id="draw-poly" title="Draw a polygon: click to add points, double-click to finish">Polygon</button>
          <button class="tool" id="draw-rect" title="Draw a rectangle: click two corners">Rectangle</button>
          <button class="tool" id="draw-view" title="Select everything in view">Whole view</button>
          <button class="tool ghost" id="draw-clear" disabled>Clear</button>
        </div>
        <div class="draw-hint" id="draw-hint" hidden></div>
        <div class="map-loading" id="map-loading">Loading survey…</div>
      </div>
      <aside class="map-side right" aria-label="Details">
        <div id="map-detail"></div>
      </aside>
    </section>

    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
